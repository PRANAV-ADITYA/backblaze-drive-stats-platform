[project]
name = "backblaze-drive-stats-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "duckdb>=1.5.6",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["exploration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
