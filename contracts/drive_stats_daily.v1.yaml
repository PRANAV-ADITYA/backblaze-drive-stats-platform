# Data contract: Backblaze Drive Stats (daily drive snapshots)
# Every rule below is backed by profiling evidence: see docs/profiling-report.md

contract:
  name: backblaze_drive_stats_daily
  version: 1.2.2
  status: draft            # becomes "active" once the Phase 3 backfill validates it
  owner: Pranav Aditya
  description: One row per operational drive per day, from Backblaze's published Drive Stats.

source:
  provider: Backblaze
  url: https://www.backblaze.com/cloud-storage/resources/hard-drive-test-data
  license: Free to use with attribution; the data may not be sold.
  delivery:
    format: ZIP containing one CSV per day
    cadence: quarterly (annual ZIPs for 2013–2015)
    file_names: ["data_Q{quarter}_{year}.zip", "data_{year}.zip"]
    first_date: 2013-04-10
  file_selection:
    include_pattern: '(?:^|/)(\d{4}-\d{2}-\d{2})\.csv$'
    exclude_paths: ["__MACOSX/"]
    date_from: file_name          # never from the date column alone
    rules:
      - Never rely on file order inside the ZIP
      - Never rely on folder names inside the ZIP
      - Record every skipped entry, never hide it

grain: one row per drive per day
primary_key: [date, serial_number]

row_rules:
  core_columns: [date, serial_number, failure]          # broken: quarantine the row
  detail_columns: every other column, SMART included    # broken: blank or keep the value, and warn
  reason: a row is useful as long as we know which drive, which day and whether it failed; that is what AFR needs
  numbers: written in full only; scientific notation (spreadsheet rounding, e.g. 4.00079E+12) is unreadable

columns:
  - name: date
    type: date
    required: true
    since: 2013-04-10
    rules:
      - "silver takes the date from the file name"
      - "the date column is a cross-check; accepted formats YYYY-MM-DD and M/D/YY (2018-02-25 is written 2/25/18)"
      - "unreadable, or a different day from the file name: quarantine the row"
    formats:                       # silver reads the date column with whichever it looks like
      - pattern: "yyyy-MM-dd"
        looks_like: '^\d{4}-\d{2}-\d{2}$'
      - pattern: "M/d/yy"            # 2018-02-25 and 2019-06-17, saved through Excel
        looks_like: '^\d{1,2}/\d{1,2}/\d{2}$'

  - name: serial_number
    type: string
    required: true
    since: 2013-04-10
    rules: ["trim spaces", "unique per date"]

  - name: model
    type: string
    required: true
    since: 2013-04-10
    rules:
      - "trim spaces"
      - "formats vary (with/without brand): normalise in gold, not here"
      - "blank: keep the row and warn; gold fills it from the same serial_number's other days"
    warn_if_blank: true

  - name: capacity_bytes
    type: bigint
    required: true
    since: 2013-04-10
    rules:
      - "must be > 0; zero, negative (sentinels such as -1) or unreadable: store null and warn"
      - "should not change for the same serial_number; gold fills nulls from the same drive's other days"
    warn_if_blank: true
    min: 1                         # below this is impossible: blank + warn

  - name: failure
    type: boolean
    required: true
    since: 2013-04-10
    rules: ["source values '0'/'1' only", "a failed drive should not appear on later days"]

  - name: vault_id
    type: integer
    required: false
    since: 2023-04-01

  - name: pod_id
    type: integer
    required: false
    since: 2023-04-01
    rules:
      - "zero-padded in source ('09'); expected range 0–19"
      - "outside the range: keep the value and warn (the range is observed, not a spec)"
    expected_range: [0, 19]          # outside: keep + warn

  - name: is_legacy_format
    type: boolean
    required: false
    since: 2023-04-01
    rules: ["accept true/false in any capitalisation ('False' in 2023, 'false' in 2026)"]

  - name: datacenter
    type: string
    required: false
    since: 2023-07-01
    rules: ["can be blank for whole vaults that were busy during collection"]
    warn_if_blank: true

  - name: cluster_id
    type: integer
    required: false
    since: 2023-07-01
    rules: ["zero-padded in source ('020')"]

  - name: pod_slot_num
    type: integer
    required: false
    since: 2023-07-01
    rules:
      - "zero-padded in source ('0007'); expected range 0–59"
      - "outside the range: keep the value and warn (the range is observed, not a spec)"
      - "blank for boot drives (always) and for data drives around their failure day"
    expected_range: [0, 59]          # outside: keep + warn

smart_columns:
  name_pattern: '^smart_(\d+)_(normalized|raw)$'
  types:
    normalized: integer
    raw: bigint                    # to be confirmed across all eras in the Phase 3 backfill
  required: false
  new_attributes: auto_add         # columns were only ever added in 13 years of history

schema_drift_policy:
  - change: new column matching the SMART pattern
    action: auto_add
  - change: new column NOT matching the SMART pattern
    action: block_day
  - change: required column missing
    action: block_day
  - change: optional column missing that existed on an earlier date
    action: warn
  - change: columns reordered only
    action: info                   # we always read by name, so order can't break us

quality_checks:
  # quarantine_row = set the row aside with a reason, keep the rest
  # block_day      = don't publish this day until a human looks
  # warn           = publish, but record and notify
  # Block only for problems we can fix ourselves. Backblaze's own gaps and hiccups are recorded, never blocked.
  - check: serial_number empty
    action: quarantine_row
  - check: failure not in {0, 1}
    action: quarantine_row
  - check: date column unreadable, or a different day from the file name
    action: quarantine_row
  - check: a detail column has an impossible or unreadable value
    action: warn
    set_value: null                # keep the row, blank only that value
  - check: a detail column is outside its expected range
    action: warn                   # keep the value; the range is observed, not a spec
  - check: silver rows + quarantined rows differ from the bronze row count
    action: block_day              # rows lost by our own pipeline
  - check: exact duplicate (same drive, same day, every value the same)
    action: warn                   # keep one copy
  - check: conflicting duplicate (same drive, same day, different values)
    action: quarantine_row         # every copy; silver never guesses which one is true
    escalate:
      when: more than 50 drives affected in one day
      action: block_day            # that many conflicts means the whole file is suspect
  - check: quarantined rows above 0.5% of the day
    action: block_day
  - check: row count below 95% of the baseline
    action: warn
    label: partial                 # Backblaze missed part of the fleet; gold can leave the day out of AFR
  - check: row count more than 3% above or below the baseline
    action: warn
  - check: day missing from the expected calendar
    action: warn                   # recorded as a known gap
  - check: daily file has no data rows
    action: warn                   # recorded as a known gap
  - check: datacenter blank
    action: warn
  - check: capacity_bytes or model changes for the same serial_number
    action: warn
    escalate:
      when: more than 50 drives affected in one day
      action: block_day
  - check: failed drive appears on a later day
    action: warn
    escalate:
      when: more than 50 drives affected in one day
      action: block_day

day_limits:                        # the numbers the blocking day checks above use
  quarantined_share: 0.005         # more than 0.5% of a day quarantined: block
  conflicting_drives: 50           # more drives with conflicting duplicates in a day: block

row_count_baseline:
  window_days: 7                 # how many earlier normal days form the median
  partial_below: 0.95            # below 95% of the median: partial day (warn + label)
  warn_beyond: 0.03              # more than 3% above or below the median: warn
  method: median of the last 7 normal days before this day
  normal_day: has data rows and is not labelled partial   # empty, missing and partial days never count
  first_days: use as many earlier normal days as exist; the first day of history is not checked
  evidence: 13 years in bronze gave 82 partial days (16 events, incl. 2013-08-20 to 2013-10-14), 43 warnings, 0 blocks

derived_rules:                     # applied in gold, documented here so they live with the data's rules
  boot_drive:
    rule: never had a pod_slot_num in the period AND capacity_bytes < 1 TB
    valid_from: 2023-07-01
    evidence: Q2 2026 → 3,949 boot drives, 0 failures (Backblaze reported 3,881)
    open_question: rule for data before 2023-07-01 (no pod_slot_num)

changelog:
  - version: 1.0.0
    date: 2026-10-04
    change: Initial contract from Phase 1 profiling (2013, Q1 2016, Q1–Q3 2023, Q2 2026)
  - version: 1.0.1
    date: 2026-10-06
    change: Drift rule for a missing optional column is judged by the day's date, never by load order (found in the Step 2.1 header check)
  - version: 1.0.2
    date: 2026-10-07
    change: File pattern anchored to the start of the file name, so "._" junk files outside __MACOSX/ are skipped
  - version: 1.1.0
    date: 2026-10-09
    change: >-
      Step 3.1 decisions, measured on 13 years in bronze. Row count is compared with the median of the
      last 7 normal days: below 95% is a partial day (warn + label), beyond ±3% warns, neither blocks.
      Empty and missing days are known gaps. Blocking is kept for our own problems (lost rows, duplicates,
      too many quarantined rows). Core columns (date, serial_number, failure) quarantine the row; detail
      columns are blanked or kept with a warning. The date column also accepts M/D/YY.
  - version: 1.1.1
    date: 2026-10-09
    change: >-
      Rules made machine-readable for silver (date formats, warn_if_blank, min, expected_range).
      Numbers in scientific notation count as unreadable: 2018-02-25 and 2019-06-17 were saved
      through Excel, which rounded large values; silver blanks them instead of approximating.
  - version: 1.2.0
    date: 2026-10-09
    change: >-
      Duplicates: exact copies keep one and warn; conflicting copies of a drive on a day are all
      quarantined (no guessing), and more than 50 such drives in one day blocks the day.
      None found in 9 sample days (1.27 M drive-days); the full backfill counts all 13 years.
  - version: 1.2.1
    date: 2026-10-10
    change: Row-count baseline numbers made machine-readable (window_days, partial_below, warn_beyond).
  - version: 1.2.2
    date: 2026-10-10
    change: Blocking day limits made machine-readable (day_limits).
