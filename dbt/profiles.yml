# How dbt connects. No secrets here: Athena uses the normal AWS login (aws login / CI keys).
backblaze:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: ap-southeast-2
      database: awsdatacatalog
      schema: dsl_dev_gold
      work_group: dsl-dev-queries
      s3_staging_dir: s3://dsl-dev-lake-739871966917/athena-results/dbt/
      s3_data_dir: s3://dsl-dev-lake-739871966917/gold/
      s3_data_naming: schema_table_unique
      threads: 4
