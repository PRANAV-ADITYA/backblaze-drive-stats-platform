version: 2

seeds:
  - name: published_afr
    description: >-
      AFR figures Backblaze stated in the text of its Drive Stats posts (their tables are images).
      period is a quarter (2019-Q2) or a year (2019-Y). status: check = tested against ours;
      known_gap = a documented difference still under investigation. One source link per row.
    config:
      column_types:
        period: string
        scope: string
        model: string
        afr_pct: double
        status: string
        note: string
        source_url: string
